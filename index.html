<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Biliardo 8</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#08150f">
<style>
*{box-sizing:border-box;margin:0;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:radial-gradient(circle at 50% 35%,#16392c,#040a07);font-family:Georgia,'Times New Roman',serif;color:#f4ead2;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:14px;padding:10px;z-index:2}
.pl{flex:1;max-width:290px;padding:8px 14px;border-radius:14px;background:#000a;border:2px solid #c9a35a33;transition:.3s}
.pl.on{border-color:#e8c36a;box-shadow:0 0 22px #e8c36a66}
.pl b{display:block;font-size:15px}.pl small{opacity:.7;font-style:italic}
.dots{display:flex;gap:3px;margin-top:5px;min-height:14px}.dots i{width:14px;height:14px;border-radius:50%;border:1px solid #fff6}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 20px;border-radius:22px;font-size:15px;z-index:2;white-space:nowrap;border:1px solid #c9a35a55}
#pw{position:fixed;left:16px;top:50%;width:20px;height:210px;margin-top:-105px;border-radius:10px;background:#000a;border:2px solid #c9a35a55;overflow:hidden;z-index:2;display:flex;align-items:flex-end}
#pwb{width:100%;height:0;background:linear-gradient(0deg,#3fdc6a,#ffd24a,#ff4a3a)}
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#000d}
.card{background:linear-gradient(#1d4c3b,#0c261d);padding:28px;border-radius:20px;text-align:center;width:min(350px,90vw);border:2px solid #c9a35a77;box-shadow:0 20px 60px #000}
.card h1{margin-bottom:6px;color:#e8c36a;font-size:30px}.card p{opacity:.7;margin-bottom:14px;font-style:italic;font-size:14px}
button,input{display:block;width:100%;margin:8px 0;padding:13px;border-radius:12px;border:0;font:inherit;font-size:16px}
button{background:#e8c36a;color:#1a1208;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}
input{text-align:center;text-transform:uppercase;letter-spacing:8px}
#code{font-size:34px;letter-spacing:8px;margin-top:10px;color:#e8c36a}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div class="pl" id="p0"></div><div class="pl" id="p1"></div></div>
<div id="pw"><div id="pwb"></div></div><div id="msg"></div>
<div id="menu"><div class="card"><h1>Biliardo 8</h1><p>Palle piene contro rigate</p>
<button onclick="local()">Gioca in locale (2 giocatori)</button>
<button onclick="host()">Crea partita online</button>
<input id="ci" maxlength="4" placeholder="CODICE">
<button onclick="join()">Unisciti con il codice</button><div id="code"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=i=>document.getElementById(i);
const W=1000,H=500,R=12,PR=[[0,0,28],[500,-8,26],[1000,0,28],[0,500,28],[500,508,26],[1000,500,28]];
const COL=['#f5f3ea','#f2c200','#1e5bd8','#d62b2b','#6a2fa8','#f07a12','#1c9b4b','#8a1b1b','#111'];
const col=n=>COL[n>8?n-8:n],grp=n=>n==8?2:n<8?0:1;
let G,S,A={a:0,p:0},OA=null,mode,me=0,moving=false,shooter=0,conn,pull=null,sc=1,ox=0,oy=0,dp=1,ac,peer;
const nm=i=>mode=='local'?'Giocatore '+(i+1):i==me?'Tu':'Avversario';
const left=k=>G.balls.filter(b=>b.n&&b.n!=8&&grp(b.n)==k&&!b.in).length;
const ser=()=>({b:G.balls.map(q=>[q.n,q.x,q.y,q.in?1:0]),t:G.turn,g:G.groups,h:G.bih,o:G.over,m:G.msg});
const apply=s=>G={balls:s.b.map(([n,x,y,i])=>({n,x,y,vx:0,vy:0,in:!!i})),turn:s.t,groups:s.g,bih:s.h,over:s.o,msg:s.m};
function newGame(){
 const o=[...Array(15).keys()].map(i=>i+1).filter(n=>n!=8).sort(()=>Math.random()-.5);o.splice(4,0,8);
 if(grp(o[10])==grp(o[14])){const k=o.findIndex((n,i)=>i<10&&i!=4&&grp(n)!=grp(o[14]));[o[10],o[k]]=[o[k],o[10]]}
 const b=[{n:0,x:250,y:250,vx:0,vy:0,in:false}];let i=0;
 for(let r=0;r<5;r++)for(let k=0;k<=r;k++)b.push({n:o[i++],x:700+r*21,y:250+(k-r/2)*24.2,vx:0,vy:0,in:false});
 G={balls:b,turn:0,groups:[null,null],bih:false,over:-1,msg:'Break! Trascina indietro la stecca e rilascia'};
}
function snd(v){v=Math.min(1,v);if(v<.05||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=280+Math.random()*120;g.gain.value=v*.25;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.09);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}
function step(){const bs=G.balls,dt=.125;
 for(let s=0;s<8;s++){
  for(const b of bs){if(b.in)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.9982;b.vy*=.9982;
   if(Math.hypot(b.vx,b.vy)<.04)b.vx=b.vy=0;
   for(const p of PR)if(Math.hypot(b.x-p[0],b.y-p[1])<p[2]){b.in=true;b.vx=b.vy=0;S.pot.push(b.n);snd(.8);break}
   if(b.in)continue;
   if(b.x<R||b.x>W-R){b.x=b.x<R?R:W-R;snd(Math.abs(b.vx)/25);b.vx*=-.8}
   if(b.y<R||b.y>H-R){b.y=b.y<R?R:H-R;snd(Math.abs(b.vy)/25);b.vy*=-.8}}
  for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){const a=bs[i],c=bs[j];if(a.in||c.in)continue;
   let dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);if(d>=2*R||d==0)continue;
   dx/=d;dy/=d;const o=(2*R-d)/2;a.x-=dx*o;a.y-=dy*o;c.x+=dx*o;c.y+=dy*o;
   const k=(c.vx-a.vx)*dx+(c.vy-a.vy)*dy;if(k>=0)continue;
   a.vx+=k*dx;a.vy+=k*dy;c.vx-=k*dx;c.vy-=k*dy;snd(-k/18);
   if(S.first==null&&(a.n==0||c.n==0))S.first=a.n==0?c.n:a.n}}}
function launch(a,p){const c=G.balls[0];c.vx=Math.cos(a)*p*32;c.vy=Math.sin(a)*p*32;shooter=G.turn;
 const g=G.groups[G.turn];S={first:null,pot:[],left0:g!=null?left(g):0};moving=true;OA=null}
function evaluate(){const m=G.turn,g=G.groups,pk=S.pot,cue=G.balls[0];let foul=false,msg='';
 if(cue.in){foul=true;msg='Fallo: bianca in buca'}
 else if(S.first==null){foul=true;msg='Fallo: nessuna palla colpita'}
 else if(!(g[m]==null?S.first!=8:(S.left0?grp(S.first)==g[m]:S.first==8))){foul=true;msg='Fallo: palla sbagliata'}
 if(pk.includes(8)){G.over=(g[m]!=null&&!left(g[m])&&!foul)?m:1-m}
 else{
  if(g[m]==null&&!foul){const f=pk.find(n=>n>0);if(f){g[m]=grp(f);g[1-m]=1-g[m]}}
  const own=g[m]!=null&&pk.some(n=>n>0&&n!=8&&grp(n)==g[m]);
  if(!foul&&own){msg=nm(m)+': bene, tira ancora'}
  else{G.turn=1-m;G.bih=foul;msg=(foul?msg+' — palla in mano a ':'Tocca a ')+nm(G.turn)}}
 if(cue.in){cue.in=false;cue.x=250;cue.y=250;cue.vx=cue.vy=0}
 G.msg=msg;hud()}
function hud(){for(let i=0;i<2;i++){const g=G.groups[i],e=$('p'+i);e.className='pl'+(G.turn==i&&G.over<0?' on':'');
 e.innerHTML=`<b>${nm(i)}</b><small>${g==null?'Tavolo aperto':g?'Rigate':'Piene'}</small><div class="dots">${g==null?'':G.balls.filter(b=>b.n&&b.n!=8&&grp(b.n)==g&&b.in).map(b=>`<i style="background:${col(b.n)}"></i>`).join('')}</div>`}
 $('msg').textContent=G.over>=0?`Vince ${nm(G.over)}! Tocca per ricominciare`:G.msg}
const myTurn=()=>G&&G.over<0&&!moving&&$('menu').style.display=='none'&&(mode=='local'||G.turn==me);
const pt=e=>({x:(e.clientX-ox)/sc-50,y:(e.clientY-oy)/sc-50});
const okPos=(x,y)=>x>R&&x<W-R&&y>R&&y<H-R&&G.balls.every(b=>b.n==0||b.in||Math.hypot(b.x-x,b.y-y)>2*R);
const send=d=>conn&&conn.open&&conn.send(d);
cv.addEventListener('pointermove',e=>{if(!myTurn())return;const m=pt(e),c=G.balls[0];
 if(G.bih){c.x=Math.max(R,Math.min(W-R,m.x));c.y=Math.max(R,Math.min(H-R,m.y));return}
 if(pull&&pull.touch){A.a=Math.atan2(c.y-m.y,c.x-m.x);A.p=Math.min(1,Math.hypot(c.x-m.x,c.y-m.y)/220)}
 else if(pull){A.p=Math.max(0,Math.min(1,((pull.s.x-m.x)*Math.cos(A.a)+(pull.s.y-m.y)*Math.sin(A.a))/190))}
 else A.a=Math.atan2(m.y-c.y,m.x-c.x);
 send({t:'aim',a:A.a,p:A.p})});
cv.addEventListener('pointerdown',e=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 if(G&&G.over>=0)return location.reload();
 if(!myTurn())return;const m=pt(e),c=G.balls[0];
 if(G.bih){c.x=m.x;c.y=m.y;if(okPos(m.x,m.y)){G.bih=false;G.msg='Mira e tira';hud();send({t:'place',x:c.x,y:c.y})}return}
 pull={s:m,touch:e.pointerType=='touch'};cv.setPointerCapture(e.pointerId);cv.dispatchEvent(new PointerEvent('pointermove',e))});
addEventListener('pointerup',()=>{if(!pull)return;const p=A.p;pull=null;A.p=0;
 if(p>.04&&myTurn()){send({t:'shot',a:A.a,p});launch(A.a,p)}});
function net(){conn.on('data',d=>{
 if(d.t=='init'){apply(d.s);start()}else if(d.t=='aim')OA=d;
 else if(d.t=='shot')launch(d.a,d.p);
 else if(d.t=='state'){apply(d.s);moving=false;hud()}
 else if(d.t=='place'){G.balls[0].x=d.x;G.balls[0].y=d.y;G.bih=false;hud()}});
 conn.on('close',()=>$('msg').textContent='Avversario disconnesso')}
function start(){$('menu').style.display='none';hud()}
function local(){mode='local';newGame();start()}
function host(){if(typeof Peer=='undefined')return alert('Servono internet e PeerJS per il multiplayer');
 const code=[...Array(4)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
 peer=new Peer('p8pool-'+code);
 peer.on('open',()=>$('code').innerHTML=code+'<p>Invia il codice all\'amico e attendi…</p>');
 peer.on('error',e=>e.type=='unavailable-id'?host():alert('Errore: '+e.type));
 peer.on('connection',c=>{conn=c;c.on('open',()=>{me=0;mode='net';newGame();send({t:'init',s:ser()});net();start()})})}
function join(){const code=$('ci').value.trim().toUpperCase();if(code.length<4)return;
 if(typeof Peer=='undefined')return alert('Servono internet e PeerJS per il multiplayer');
 $('code').textContent='Connessione…';peer=new Peer();
 peer.on('error',e=>$('code').textContent='Partita non trovata');
 peer.on('open',()=>{conn=peer.connect('p8pool-'+code);conn.on('open',()=>{me=1;mode='net';net();$('code').textContent='Attendo il tavolo…'})})}
function rs(){dp=devicePixelRatio||1;cv.width=innerWidth*dp;cv.height=innerHeight*dp;sc=Math.min(innerWidth/1100,(innerHeight-130)/600);ox=(innerWidth-1100*sc)/2;oy=(innerHeight-600*sc)/2+35}
addEventListener('resize',rs);rs();
function ball(b){ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#0005';ctx.beginPath();ctx.arc(3,4,R,0,7);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.clip();ctx.fillStyle=b.n>8?'#f5f3ea':col(b.n);ctx.fillRect(-R,-R,2*R,2*R);
 if(b.n>8){ctx.fillStyle=col(b.n);ctx.fillRect(-R,-R*.55,2*R,R*1.1)}ctx.restore();
 if(b.n){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,R*.46,0,7);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.n,0,.5)}
 const g=ctx.createRadialGradient(-4,-4,1,0,0,R);g.addColorStop(0,'#fffa');g.addColorStop(.4,'#fff0');g.addColorStop(1,'#0006');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.restore()}
function table(){let g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#8a5a2c');g.addColorStop(1,'#4a2a12');
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(0,0,1100,600,44);ctx.fill();
 ctx.strokeStyle='#e8c36a55';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(8,8,1084,584,38);ctx.stroke();
 ctx.save();ctx.translate(50,50);
 ctx.fillStyle='#0a3a22';ctx.fillRect(-8,-8,W+16,H+16);
 g=ctx.createRadialGradient(500,250,60,500,250,620);g.addColorStop(0,'#21915a');g.addColorStop(1,'#0c4a2b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#ffffff22';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(250,0);ctx.lineTo(250,H);ctx.stroke();
 ctx.fillStyle='#e8c36a';for(let i=1;i<8;i++)if(i!=4){for(const y of[-26,H+26]){ctx.beginPath();ctx.arc(i*125,y,3.5,0,7);ctx.fill()}}
 for(const y of[125,250,375])for(const x of[-26,W+26]){ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill()}
 ctx.fillStyle='#000';for(const p of PR){ctx.beginPath();ctx.arc(p[0],p[1],p[2]-3,0,7);ctx.fill()}
 ctx.restore()}
function stick(a,p,al){const c=G.balls[0],off=R+8+p*110;ctx.save();ctx.translate(50+c.x,50+c.y);ctx.rotate(a);ctx.globalAlpha=al;
 ctx.shadowColor='#0008';ctx.shadowBlur=8;ctx.shadowOffsetY=5;
 const g=ctx.createLinearGradient(-off-300,0,-off,0);g.addColorStop(0,'#241206');g.addColorStop(.75,'#d9a35c');g.addColorStop(1,'#f3dfb0');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-off,-2.2);ctx.lineTo(-off-300,-5.5);ctx.lineTo(-off-300,5.5);ctx.lineTo(-off,2.2);ctx.fill();
 ctx.fillStyle='#4aa3d8';ctx.fillRect(-off-7,-2.2,7,4.4);ctx.restore()}
function guide(){const c=G.balls[0],dx=Math.cos(A.a),dy=Math.sin(A.a);let t=1e9,hit=null;
 for(const b of G.balls){if(!b.n||b.in)continue;const fx=b.x-c.x,fy=b.y-c.y,pr=fx*dx+fy*dy;if(pr<0)continue;
  const d2=fx*fx+fy*fy-pr*pr;if(d2>4*R*R)continue;const tt=pr-Math.sqrt(4*R*R-d2);if(tt<t){t=tt;hit=b}}
 let tw=1e9;if(dx>0)tw=Math.min(tw,(W-R-c.x)/dx);if(dx<0)tw=Math.min(tw,(R-c.x)/dx);
 if(dy>0)tw=Math.min(tw,(H-R-c.y)/dy);if(dy<0)tw=Math.min(tw,(R-c.y)/dy);
 if(!hit||tw<t){t=tw;hit=null}
 const ex=c.x+dx*t,ey=c.y+dy*t,L=(x1,y1,x2,y2,w,s)=>{ctx.strokeStyle=s;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
 ctx.save();ctx.translate(50,50);ctx.setLineDash([9,7]);L(c.x,c.y,ex,ey,2,'#ffffffcc');ctx.setLineDash([]);
 ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,R,0,7);ctx.stroke();
 if(hit){const nx=(hit.x-ex)/(2*R),ny=(hit.y-ey)/(2*R),dt=dx*nx+dy*ny,tx=dx-dt*nx,ty=dy-dt*ny;
  L(hit.x,hit.y,hit.x+nx*120*dt,hit.y+ny*120*dt,3,'#ffd24acc');L(ex,ey,ex+tx*70,ey+ty*70,2,'#ffffff88')}
 ctx.restore()}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 ctx.setTransform(dp*sc,0,0,dp*sc,dp*ox,dp*oy);table();
 ctx.save();ctx.translate(50,50);for(const b of G.balls)if(!b.in)ball(b);ctx.restore();
 if(!moving&&G.over<0&&!G.bih){
  if(myTurn()){guide();stick(A.a,A.p,1)}
  else if(OA)stick(OA.a,OA.p,.8)}
 $('pwb').style.height=A.p*100+'%'}
function loop(){requestAnimationFrame(loop);if(!G)return;
 if(moving){step();if(!G.balls.some(b=>!b.in&&(b.vx||b.vy))){moving=false;
  if(mode=='local'||shooter==me){evaluate();send({t:'state',s:ser()})}}}
 draw()}
loop();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
